<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
  <link rel="stylesheet" href="app.css">
  <title>Instagram • Login</title>

</head>
<body>

  <div class="container">
    <!-- Login Form Box -->
    <div class="box">
      <h1 class="logo">Instagram</h1>
      <form action="#" method="POST" class="login-form">
        <input type="text" placeholder="Phone number, username, or email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit" class="btn-login">Log in</button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>

      <div class="social-login">
        <a href="https://web.facebook.com/login/?" target="_blank" class="fb-login"><i class="fab fa-facebook"></i> Log in with Facebook</a>
      <a href="#" class="forgot-password">Forgot password?</a></div>
    </div>

    <!-- Sign Up Redirect Box -->
    <div class="box signup-box">
      Don't have an account? <a href="#">Sign up</a>
    </div>

    <!-- App Download Section -->
    <div class="app-download">
      <p>Get the app.</p>
      <div class="badges">
        <img src="https://static.cdninstagram.com/rsrc.php/v3/yt/r/yR0Rm-L3y2W.png" alt="Get it on Google Play">
        <img src="https://static.cdninstagram.com/rsrc.php/v3/y9/r/4_A2m3A2D2B.png" alt="Get it from Microsoft">
      </div>
    </div>
  </div>

</body>
</html>
